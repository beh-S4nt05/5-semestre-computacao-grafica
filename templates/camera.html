<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Câmera</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles/style.css') }}"
    />
  </head>
  <body>
    <main class="container card camera-card">
      <h1>Captura de imagem</h1>
      <p>Olá, {{ usuario }}. Habilite a câmera e capture um frame.</p>
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas" hidden></canvas>
      <p id="mensagem" class="mensagem">A câmera ainda não foi iniciada.</p>
      <div class="acoes">
        <button id="btnAbrir" type="button">Habilitar câmera</button>
        <button id="btnCapturar" type="button" disabled>Capturar frame</button>
        <button id="btnFechar" type="button" class="secundario">
          Desligar câmera
        </button>
        <a class="botao secundario" href="{{ url_for('bem_vindo') }}">Voltar</a>
      </div>
    </main>
    <script>
      // Define a URL globalmente antes de carregar o camera.js
      const URL_CAPTURAR_FRAME = "{{ url_for('camera.capturar_frame') }}";
    </script>
    <script src="{{ url_for('static', filename='scripts/camera.js') }}"></script>
  </body>
</html>
